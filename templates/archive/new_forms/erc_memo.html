<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERC Memo</title>
  <style>
    :root{
      --outer:#5f5f5f;
      --line:#bdbdbd;
      --bg:#f4f4f4;
      --text:#2a2a2a;
      --muted:#6f6f6f;
      --panel:#ffffff;
      --section:#efefef;
      --danger:#b00020;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:26px;
      background:var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;}
    .h1{
      font-size:26px;
      font-weight:700;
      text-decoration: underline;
      margin:0 0 16px;
    }

    .box{
      background:var(--panel);
      border:2px solid var(--outer);
      padding:26px 26px 22px;
    }

    .top{
      display:grid;
      grid-template-columns: 1fr 1fr;
      column-gap:120px;
      row-gap:14px;
      padding:4px 6px 18px;
    }

    .row{
      display:grid;
      grid-template-columns: 165px 1fr;
      align-items:center;
      gap:14px;
      font-size:13px;
    }
    .row .lbl{
      font-weight:700;
      color:#4a4a4a;
      text-align:left;
    }
    input[type="text"], select{
      width:100%;
      height:28px;
      padding:4px 8px;
      border:1px solid var(--line);
      background:#fff;
      font-size:13px;
    }

    .date{
      display:grid;
      grid-template-columns: 1fr 22px;
      align-items:center;
      gap:8px;
    }
    .cal{
      width:22px;height:22px;
      border:1px solid var(--line);
      background:#f2f2f2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      color:#555;
      user-select:none;
    }

    .fileline{display:flex; align-items:center; gap:10px;}
    .fileline input[type=file]{font-size:13px;}

    .hr{
      margin:0 -26px;
      border-top:1px solid #9e9e9e;
    }

    .section{
      background:var(--section);
      margin:0 -26px;
      padding:14px 26px 20px;
    }
    .section .title{
      font-size:18px;
      font-weight:400;
      color:#3a3a3a;
      margin:0 0 10px;
    }

    .inv-grid{
      display:grid;
      grid-template-columns: 1.25fr 0.9fr 0.9fr 1fr 120px;
      gap:16px;
      align-items:end;
      margin-bottom:6px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:13px;
    }
    .field label{
      font-weight:700;
      color:#4a4a4a;
      font-size:12.5px;
    }
    .btn-add{
      height:30px;
      border:1px solid #8e8e8e;
      background:#d0d0d0;
      font-size:12.5px;
      font-weight:700;
      cursor:pointer;
    }

    .error{
      color:var(--danger);
      font-size:12px;
      min-height:14px;
      margin-top:2px;
    }
    .invalid{border-color:var(--danger)!important;}

    table{
      width:100%;
      border-collapse:collapse;
      margin:10px 0 0;
      font-size:13px;
      background:#fff;
    }
    th, td{
      border:1px solid var(--line);
      padding:8px;
      text-align:left;
      vertical-align:top;
    }
    th{background:#f2f2f2;}
    .mini-btn{
      padding:4px 10px;
      border:1px solid #8e8e8e;
      background:#e6e6e6;
      cursor:pointer;
      font-size:12px;
      margin-right:6px;
    }

    .content{
      margin-top:12px;
      display:grid;
      grid-template-columns: 165px 1fr;
      gap:14px;
      align-items:start;
    }

    .toolbar{
      border:1px solid var(--line);
      border-bottom:none;
      background:#f1f1f1;
      padding:6px;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:12px;
    }
    .tbtn{
      border:1px solid #c0c0c0;
      background:#fff;
      padding:3px 7px;
      cursor:pointer;
      font-size:12px;
      line-height:1;
    }
    .sep{width:1px;height:18px;background:#c9c9c9;margin:0 4px;}
    .dd{
      border:1px solid #c0c0c0;
      background:#fff;
      padding:3px 6px;
      font-size:12px;
    }
    .editor{
      border:1px solid var(--line);
      min-height:175px;
      padding:10px;
      background:#fff;
      font-size:13px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:16px;
      padding-top:18px;
    }
    .btn{
      padding:7px 18px;
      border:1px solid #8e8e8e;
      background:#e6e6e6;
      cursor:pointer;
      font-size:13px;
    }
    .btn.primary{background:#d0d0d0;font-weight:700;}

    @media (max-width: 980px){
      .top{grid-template-columns:1fr; column-gap:0;}
      .inv-grid{grid-template-columns:1fr;}
      .content{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="h1">ERC Memo</div>

    <div class="box">
      <form id="ercForm" novalidate>
        <div class="top">
          <!-- LEFT COLUMN -->
          <div>
            <div class="row">
              <div class="lbl">File Number</div>
              <input type="text" name="fileNumber" />
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Source of Query</div>
              <input type="text" name="sourceOfQuery" placeholder="Source of Query" />
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Date of Reply</div>
              <div class="date">
                <input type="text" name="dateOfReply" placeholder="dd / mm / yyyy" />
                <div class="cal">▾</div>
              </div>
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Sector</div>
              <select name="sector">
                <option value="">Sector</option>
              </select>
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Files</div>
              <div class="fileline">
                <input type="file" name="files" />
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div>
            <div class="row">
              <div class="lbl">Company Name</div>
              <input type="text" name="companyName" />
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Date of Receipt</div>
              <div class="date">
                <input type="text" name="dateOfReceipt" placeholder="dd / mm / yyyy" />
                <div class="cal">▾</div>
              </div>
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Issue</div>
              <input type="text" name="issue" placeholder="Issue" />
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="lbl">Adverse</div>
              <select name="adverse">
                <option value="">Adverse</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
          </div>
        </div>

        <div class="hr"></div>

        <div class="section">
          <div class="title">Invester Company</div>

          <div class="inv-grid">
            <div class="field">
              <label>Name</label>
              <input type="text" id="invName" />
              <div class="error" id="errInvName"></div>
            </div>
            <div class="field">
              <label>Country</label>
              <input type="text" id="invCountry" />
              <div class="error" id="errInvCountry"></div>
            </div>
            <div class="field">
              <label>Ownership</label>
              <input type="text" id="invOwnership" />
            </div>
            <div class="field">
              <label>Shareholding</label>
              <input type="text" id="invShareholding" />
            </div>
            <button type="button" class="btn-add" id="addInvestor">ADD ROW</button>
          </div>

          <!-- Working table (so user can see rows added) -->
          <table id="investorTable" aria-label="Investor rows">
            <thead>
              <tr>
                <th>Name</th>
                <th>Country</th>
                <th>Ownership</th>
                <th>Shareholding</th>
                <th style="width:140px;">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="content">
            <div class="lbl" style="padding-top:6px;">Content</div>
            <div>
              <div class="toolbar">
                <button class="tbtn" type="button" data-cmd="cut">✂</button>
                <button class="tbtn" type="button" data-cmd="copy">⎘</button>
                <button class="tbtn" type="button" data-cmd="paste">⎀</button>
                <span class="sep"></span>
                <button class="tbtn" type="button" data-cmd="bold"><b>B</b></button>
                <button class="tbtn" type="button" data-cmd="italic"><i>I</i></button>
                <button class="tbtn" type="button" data-cmd="underline"><u>U</u></button>
                <button class="tbtn" type="button" data-cmd="strikeThrough"><s>S</s></button>
                <span class="sep"></span>
                <button class="tbtn" type="button" data-cmd="insertUnorderedList">•</button>
                <button class="tbtn" type="button" data-cmd="insertOrderedList">1.</button>
                <span class="sep"></span>
                <select class="dd" data-dd="formatBlock" title="Styles">
                  <option value="">Styles</option>
                  <option value="h1">Heading 1</option>
                  <option value="h2">Heading 2</option>
                  <option value="p">Paragraph</option>
                </select>
                <select class="dd" data-dd="fontName" title="Format">
                  <option value="">Format</option>
                  <option value="Arial">Arial</option>
                  <option value="Times New Roman">Times New Roman</option>
                  <option value="Courier New">Courier New</option>
                </select>
                <span class="sep"></span>
                <button class="tbtn" type="button" id="toggleSource">Source</button>
              </div>

              <div id="editor" class="editor" contenteditable="true"></div>
              <textarea id="sourceArea" class="editor" style="display:none; font-family: monospace;"></textarea>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Submit</button>
          <button class="btn" type="reset">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    const invName = $('#invName');
    const invCountry = $('#invCountry');
    const invOwnership = $('#invOwnership');
    const invShareholding = $('#invShareholding');

    const errInvName = $('#errInvName');
    const errInvCountry = $('#errInvCountry');

    const investorTbody = document.querySelector('#investorTable tbody');

    function escapeHtml(str){
      return (str || '').replace(/[&<>"]/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
      }[c]));
    }

    function setError(inputEl, errEl, msg){
      if (!errEl) return;
      errEl.textContent = msg || '';
      if (msg) inputEl.classList.add('invalid');
      else inputEl.classList.remove('invalid');
    }

    function validateInvestor(){
      let ok = true;
      const n = invName.value.trim();
      const c = invCountry.value.trim();

      if (!n){ setError(invName, errInvName, 'Name is required'); ok = false; }
      else setError(invName, errInvName, '');

      if (!c){ setError(invCountry, errInvCountry, 'Country is required'); ok = false; }
      else setError(invCountry, errInvCountry, '');

      return ok;
    }

    invName.addEventListener('input', () => setError(invName, errInvName, ''));
    invCountry.addEventListener('input', () => setError(invCountry, errInvCountry, ''));

    // FIXED + WORKING ADD ROW
    document.getElementById('addInvestor').addEventListener('click', () => {
      if (!validateInvestor()) return;

      const name = invName.value.trim();
      const country = invCountry.value.trim();
      const ownership = invOwnership.value.trim();
      const shareholding = invShareholding.value.trim();

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(country)}</td>
        <td>${escapeHtml(ownership)}</td>
        <td>${escapeHtml(shareholding)}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="mini-btn" data-act="edit">Edit</button>
          <button type="button" class="mini-btn" data-act="del">Delete</button>
        </td>
      `;
      investorTbody.appendChild(tr);

      // clear
      invName.value = '';
      invCountry.value = '';
      invOwnership.value = '';
      invShareholding.value = '';
      setError(invName, errInvName, '');
      setError(invCountry, errInvCountry, '');
    });

    // Edit/Delete
    investorTbody.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const tr = btn.closest('tr');
      const act = btn.getAttribute('data-act');
      if (!tr) return;

      if (act === 'del') tr.remove();

      if (act === 'edit') {
        const tds = tr.querySelectorAll('td');
        invName.value = tds[0].textContent.trim();
        invCountry.value = tds[1].textContent.trim();
        invOwnership.value = tds[2].textContent.trim();
        invShareholding.value = tds[3].textContent.trim();
        tr.remove();
        invName.focus();
      }
    });

    // Editor toolbar
    const editor = document.getElementById('editor');
    const sourceArea = document.getElementById('sourceArea');
    const toggleSourceBtn = document.getElementById('toggleSource');

    function isSourceMode(){ return sourceArea.style.display !== 'none'; }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isSourceMode()) return;
        const cmd = btn.getAttribute('data-cmd');
        try { document.execCommand(cmd, false, null); } catch (e) {}
        editor.focus();
      });
    });

    document.querySelectorAll('[data-dd]').forEach(dd => {
      dd.addEventListener('change', () => {
        if (isSourceMode()) return;
        const cmd = dd.getAttribute('data-dd');
        const val = dd.value;
        if (!val) return;
        try { document.execCommand(cmd, false, val); } catch (e) {}
        dd.value = '';
        editor.focus();
      });
    });

    toggleSourceBtn.addEventListener('click', () => {
      if (!isSourceMode()) {
        sourceArea.value = editor.innerHTML;
        editor.style.display = 'none';
        sourceArea.style.display = 'block';
      } else {
        editor.innerHTML = sourceArea.value;
        sourceArea.style.display = 'none';
        editor.style.display = 'block';
      }
    });

    // Submit demo: require at least 1 investor row
    document.getElementById('ercForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const hasRows = investorTbody.querySelectorAll('tr').length > 0;
      if (!hasRows){
        alert('Please add at least one Invester Company row using ADD ROW.');
        return;
      }
      alert('Submitted (demo). Connect this to your backend/API.');
    });

    // Reset: clear errors + table
    document.getElementById('ercForm').addEventListener('reset', () => {
      setTimeout(() => {
        investorTbody.innerHTML = '';
        setError(invName, errInvName, '');
        setError(invCountry, errInvCountry, '');
      }, 0);
    });
  </script>
</body>
</html>
