<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Other Reports</title>
  <style>
    :root{
      --border:#6f6f6f;
      --muted:#777;
      --bg:#f5f5f5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:24px;
      font-family: Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:#222;
    }
    .page{
      max-width:1050px;
      margin:0 auto;
    }
    .title{
      font-size:22px;
      font-weight:700;
      text-decoration: underline;
      margin:0 0 14px;
    }
    .panel{
      background:#fff;
      border:2px solid var(--border);
      padding:26px 28px 18px;
    }

    /* Two-column header section */
    .top-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      column-gap:70px;
      row-gap:18px;
      align-items:start;
      margin-bottom:16px;
    }

    .field-row{
      display:grid;
      grid-template-columns: 140px 1fr;
      align-items:center;
      gap:10px;
      font-size:13px;
    }
    .label{
      font-weight:600;
      color:#444;
    }
    input[type="text"], input[type="date"], select{
      width:100%;
      padding:6px 8px;
      border:1px solid #b5b5b5;
      font-size:13px;
      background:#fff;
    }

    .upload-row{
      display:grid;
      grid-template-columns: 140px auto 1fr;
      align-items:center;
      gap:10px;
      font-size:13px;
    }
    .hint{
      color:var(--muted);
      font-size:12px;
      text-align:right;
      white-space:nowrap;
    }

    /* Content editor */
    .content-wrap{
      display:grid;
      grid-template-columns: 140px 1fr;
      gap:10px;
      align-items:start;
      margin-top:6px;
    }

    .toolbar{
      border:1px solid #b5b5b5;
      border-bottom:none;
      background:#f1f1f1;
      padding:6px 6px;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:12px;
    }
    .tool-btn{
      border:1px solid #c0c0c0;
      background:#fff;
      padding:3px 7px;
      cursor:pointer;
      font-size:12px;
      line-height:1;
    }
    .tool-sep{width:1px;height:18px;background:#c9c9c9;margin:0 4px;}
    .tool-dd{
      border:1px solid #c0c0c0;
      background:#fff;
      padding:3px 6px;
      font-size:12px;
    }

    .editor{
      border:1px solid #b5b5b5;
      min-height:210px;
      padding:10px;
      font-size:13px;
      background:#fff;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:14px;
      padding-top:18px;
    }
    .btn{
      padding:6px 18px;
      border:1px solid #9a9a9a;
      background:#e9e9e9;
      cursor:pointer;
      font-size:13px;
    }
    .btn.primary{
      background:#d0d0d0;
      font-weight:600;
    }

    /* Small responsiveness */
    @media (max-width: 900px){
      .top-grid{grid-template-columns:1fr; column-gap:0;}
      .upload-row{grid-template-columns: 140px 1fr;}
      .hint{text-align:left; white-space:normal;}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">Other Reports</div>

    <div class="panel">
      <form>
        <div class="top-grid">
          <!-- LEFT COLUMN -->
          <div style="    margin-left: -1rem;">
            <div class="field-row">
              <div class="label">File Number</div>
              <input type="text" name="fileNumber" />
            </div>

            <div class="field-row" style="margin-top:14px;">
              <div class="label">Category</div>
              <select name="category">
                <option value="">Select Category</option>
              </select>
            </div>

            <div class="field-row" style="margin-top:14px;">
              <div class="label">Unit</div>
              <select name="unit">
                <option value="">Select Group</option>
              </select>
            </div>

            <div class="upload-row" style="margin-top:14px;">
              <div class="label">Files</div>
              <input type="file" name="pdfFiles" multiple />
              <div class="hint">PDF / Text Format</div>
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div style="    margin-left: -2.9rem;">
            <div class="field-row">
              <div class="label">Name Of Operation</div>
              <input type="text" name="operationName" />
            </div>

            <div class="field-row" style="margin-top:14px;">
              <div class="label">Date</div>
              <!-- use text to match dd/mm/yyyy look -->
              <input type="text" name="date" placeholder="dd/mm/yyyy" />
            </div>

            <div class="field-row" style="margin-top:14px;">
              <div class="label">Prepared By</div>
              <input type="text" name="preparedBy" />
            </div>

            <div class="upload-row" style="margin-top:14px;">
              <div class="label">Files</div>
              <input type="file" name="audioFiles" multiple accept="audio/*" />
              <div class="hint">Audio Format</div>
            </div>
          </div>
        </div>

        <div class="content-wrap" style="margin-right: -0.9rem; margin-left: -1rem;">
          <div class="label" style="padding-top:6px;">Content</div>
          <div>
            <div class="toolbar" aria-label="editor toolbar">
              <button class="tool-btn" type="button" data-cmd="cut">✂</button>
              <button class="tool-btn" type="button" data-cmd="copy">⎘</button>
              <button class="tool-btn" type="button" data-cmd="paste">⎀</button>
              <span class="tool-sep"></span>
              <button class="tool-btn" type="button" data-cmd="bold"><b>B</b></button>
              <button class="tool-btn" type="button" data-cmd="italic"><i>I</i></button>
              <button class="tool-btn" type="button" data-cmd="underline"><u>U</u></button>
              <button class="tool-btn" type="button" data-cmd="strikeThrough"><s>S</s></button>
              <span class="tool-sep"></span>
              <button class="tool-btn" type="button" data-cmd="insertUnorderedList">• List</button>
              <button class="tool-btn" type="button" data-cmd="insertOrderedList">1. List</button>
              <span class="tool-sep"></span>
              <select class="tool-dd" data-dd="formatBlock" title="Styles">
                <option value="">Styles</option>
                <option value="h1">Heading 1</option>
                <option value="h2">Heading 2</option>
                <option value="p">Paragraph</option>
              </select>
              <select class="tool-dd" data-dd="fontName" title="Format">
                <option value="">Format</option>
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
              </select>
              <span class="tool-sep"></span>
              <button class="tool-btn" type="button" id="toggleSource">Source</button>
              <button class="tool-btn" type="button" id="helpBtn">?</button>
            </div>

            <div id="editor" class="editor" contenteditable="true"></div>
            <textarea id="sourceArea" class="editor" style="display:none; font-family: monospace;"></textarea>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Submit</button>
          <button class="btn" type="reset">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Lightweight toolbar behavior (keeps it single-file)
    const editor = document.getElementById('editor');
    const sourceArea = document.getElementById('sourceArea');
    const toggleSourceBtn = document.getElementById('toggleSource');

    function isSourceMode() {
      return sourceArea.style.display !== 'none';
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isSourceMode()) return;
        const cmd = btn.getAttribute('data-cmd');
        try { document.execCommand(cmd, false, null); } catch (e) {}
        editor.focus();
      });
    });

    document.querySelectorAll('[data-dd]').forEach(dd => {
      dd.addEventListener('change', () => {
        if (isSourceMode()) return;
        const cmd = dd.getAttribute('data-dd');
        const val = dd.value;
        if (!val) return;
        try {
          if (cmd === 'formatBlock') document.execCommand(cmd, false, val);
          else document.execCommand(cmd, false, val);
        } catch (e) {}
        dd.value = '';
        editor.focus();
      });
    });

    toggleSourceBtn.addEventListener('click', () => {
      if (!isSourceMode()) {
        sourceArea.value = editor.innerHTML;
        editor.style.display = 'none';
        sourceArea.style.display = 'block';
      } else {
        editor.innerHTML = sourceArea.value;
        sourceArea.style.display = 'none';
        editor.style.display = 'block';
      }
    });

    document.getElementById('helpBtn').addEventListener('click', () => {
      alert('Editor tips:\n- Use B/I/U to format text\n- Use Source to edit HTML\n- Lists create bullet/numbered lists');
    });

    // Prevent page reload on submit for demo
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Submitted (demo). Hook this up to your backend/API as needed.');
    });
  </script>
</body>
</html>
