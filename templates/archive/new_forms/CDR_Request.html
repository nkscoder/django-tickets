<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDR Request</title>
  <style>
    :root{
      --outer:#5f5f5f;
      --line:#bdbdbd;
      --bg:#f4f4f4;
      --panel:#ffffff;
      --text:#2a2a2a;
      --muted:#6f6f6f;
      --header:#efefef;
      --danger:#b00020;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:26px;
      background:var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;}

    .box{background:var(--panel); border:2px solid var(--outer);}

    .bar{
      background:var(--header);
      border-bottom:1px solid var(--line);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .bar .title{font-size:18px; font-weight:400;}
    .bar .btn-small{
      padding:5px 12px;
      border:1px solid #8e8e8e;
      background:#d0d0d0;
      cursor:pointer;
      font-size:12.5px;
      font-weight:700;
    }

    .content{padding:18px 22px 20px;}

    .top-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      column-gap:120px;
      row-gap:14px;
      padding:0 4px 10px;
    }
    .row{
      display:grid;
      grid-template-columns: 170px 1fr;
      align-items:center;
      gap:14px;
      font-size:13px;
    }
    .lbl{font-weight:700;color:#4a4a4a;}

    input[type="text"], select{
      width:100%;
      height:28px;
      padding:4px 8px;
      border:1px solid var(--line);
      background:#fff;
      font-size:13px;
    }

    .radio-group{
      display:flex;
      align-items:center;
      gap:18px;
      font-size:13px;
    }
    .radio-group label{
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:#333;
    }

    .date{
      display:grid;
      grid-template-columns: 1fr 22px;
      align-items:center;
      gap:8px;
    }
    .cal{
      width:22px;height:22px;
      border:1px solid var(--line);
      background:#f2f2f2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      color:#555;
      user-select:none;
    }

    .hr{margin:10px -22px 0; border-top:1px solid #9e9e9e;}
    .details-head{
      font-size:14px;
      color:#3a3a3a;
      padding:10px 4px 0;
      font-weight:400;
    }

    .details-grid{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr 0.9fr 170px;
      gap:26px;
      padding:12px 4px 10px;
      align-items:start;
    }

    .field{display:flex; flex-direction:column; gap:6px; font-size:13px;}
    .field label{font-weight:700;color:#4a4a4a;font-size:12.5px;}

    .actions-col{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }
    .actions-col .lbl{margin-top:2px;}
    .btn-add{
      padding:6px 14px;
      border:1px solid #8e8e8e;
      background:#d0d0d0;
      cursor:pointer;
      font-size:12.5px;
      font-weight:700;
    }

    .error{
      color:var(--danger);
      font-size:12px;
      margin-top:2px;
      min-height:14px;
    }
    .invalid{
      border-color: var(--danger) !important;
      outline: none;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin:8px 4px 0;
      font-size:13px;
    }
    th, td{
      border:1px solid var(--line);
      padding:8px;
      text-align:left;
      vertical-align:top;
    }
    th{background:#f2f2f2;}

    .mini-btn{
      padding:4px 10px;
      border:1px solid #8e8e8e;
      background:#e6e6e6;
      cursor:pointer;
      font-size:12px;
      margin-right:6px;
    }

    .bottom-grid{
      display:grid;
      grid-template-columns: 1fr 1fr 0.8fr 1fr;
      gap:26px;
      padding:12px 4px 0;
      align-items:end;
    }

    .fileline{display:flex; align-items:center; gap:10px;}
    input[type=file]{font-size:13px;}
    .hint{color:var(--muted);font-size:12px;}

    .footer-actions{
      display:flex;
      justify-content:center;
      gap:16px;
      padding-top:16px;
    }
    .btn{
      padding:7px 18px;
      border:1px solid #8e8e8e;
      background:#e6e6e6;
      cursor:pointer;
      font-size:13px;
    }
    .btn.primary{background:#d0d0d0;font-weight:700;}

    @media (max-width: 1050px){
      .top-grid{grid-template-columns:1fr; column-gap:0;}
      .details-grid{grid-template-columns:1fr;}
      .bottom-grid{grid-template-columns:1fr;}
      .hr{margin-left:0;margin-right:0;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="bar">
        <div class="title">CDR Request</div>
        <button type="button" class="btn-small" id="btnClose">Close</button>
      </div>

      <div class="content">
        <form id="cdrForm" novalidate>
          <div class="top-grid">
            <!-- LEFT -->
            <div>
              <div class="row">
                <div class="lbl">Request Type</div>
                <div class="radio-group">
                  <label><input type="radio" name="requestType" value="CDR" checked /> CDR</label>
                  <label><input type="radio" name="requestType" value="IPDR" /> IPDR</label>
                </div>
              </div>

              <div class="row" style="margin-top:12px;">
                <div class="lbl">Officer Name</div>
                <input type="text" name="officerName" />
              </div>
            </div>

            <!-- RIGHT -->
            <div>
              <div class="row">
                <div class="lbl">File Number</div>
                <input type="text" name="fileNumber" />
              </div>

              <div class="row" style="margin-top:12px;">
                <div class="lbl">Date</div>
                <div class="date">
                  <input type="text" name="date" placeholder="dd/mm/yyyy" />
                  <div class="cal">▾</div>
                </div>
              </div>

              <div class="row" style="margin-top:12px;">
                <div class="lbl">Officer Designation</div>
                <select name="designation">
                  <option value="">--Select Designation--</option>
                  <option>RA</option>
                  <option>ASO</option>
                  <option>SO</option>
                </select>
              </div>
            </div>
          </div>

          <div class="hr"></div>
          <div class="details-head">Details</div>

          <div class="details-grid">
            <div class="field">
              <label>Mobile No</label>
              <input type="text" name="mobile" placeholder="10 digit mobile" />
              <div class="error" id="errMobile"></div>
            </div>

            <div class="field">
              <label>Start Date</label>
              <div class="date">
                <input type="text" name="startDate" placeholder="dd/mm/yyyy" />
                <div class="cal">▾</div>
              </div>
              <div class="error" id="errStart"></div>
            </div>

            <div class="field">
              <label>End Date</label>
              <div class="date">
                <input type="text" name="endDate" placeholder="dd/mm/yyyy" />
                <div class="cal">▾</div>
              </div>
              <div class="error" id="errEnd"></div>
            </div>

            <div class="actions-col">
              <div class="lbl">Actions</div>
              <button type="button" class="btn-add" id="addRow">ADD ROW</button>
            </div>
          </div>

          <table id="detailsTable" aria-label="Details rows">
            <thead>
              <tr>
                <th>Mobile No</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th style="width:140px;">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="bottom-grid">
            <div class="field">
              <label>CDR Request Files</label>
              <div class="fileline">
                <input type="file" name="cdrRequestFiles" />
                <span class="hint">docx</span>
              </div>
            </div>

            <div class="field">
              <label>RAW CDR Files</label>
              <div class="fileline">
                <input type="file" name="rawCdrFiles" />
                <span class="hint">Excel</span>
              </div>
            </div>

            <div class="field">
              <label>Date of Receiving</label>
              <div class="date">
                <input type="text" name="dateOfReceiving" placeholder="dd/mm/yyyy" />
                <div class="cal">▾</div>
              </div>
            </div>

            <div></div>
          </div>

          <div class="footer-actions">
            <button type="submit" class="btn primary">Submit</button>
            <button type="reset" class="btn">Reset</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const mobileEl = $('[name="mobile"]');
    const startEl  = $('[name="startDate"]');
    const endEl    = $('[name="endDate"]');
    const errMobile = $('#errMobile');
    const errStart  = $('#errStart');
    const errEnd    = $('#errEnd');
    const tableBody = document.querySelector('#detailsTable tbody');

    document.getElementById('btnClose').addEventListener('click', () => {
      alert('Close clicked (demo).');
    });

    // Helpers
    function escapeHtml(str){
      return (str || '').replace(/[&<>"]/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
      }[c]));
    }

    function setError(inputEl, errEl, msg){
      if (!errEl) return;
      errEl.textContent = msg || '';
      if (msg) inputEl.classList.add('invalid');
      else inputEl.classList.remove('invalid');
    }

    // Parse dd/mm/yyyy
    function parseDMY(str){
      const s = (str || '').trim();
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
      if (!m) return null;
      const dd = Number(m[1]), mm = Number(m[2]), yyyy = Number(m[3]);
      if (mm < 1 || mm > 12) return null;
      const d = new Date(yyyy, mm - 1, dd);
      if (d.getFullYear() !== yyyy || d.getMonth() !== (mm - 1) || d.getDate() !== dd) return null;
      return d;
    }

    function validateRow(){
      let ok = true;

      // Mobile: required + 10 digits
      const mobile = mobileEl.value.trim();
      if (!mobile) { setError(mobileEl, errMobile, 'Mobile number is required'); ok = false; }
      else if (!/^\d{10}$/.test(mobile)) { setError(mobileEl, errMobile, 'Enter valid 10 digit mobile'); ok = false; }
      else setError(mobileEl, errMobile, '');

      // Dates: required + valid format
      const sdStr = startEl.value.trim();
      const edStr = endEl.value.trim();
      const sd = parseDMY(sdStr);
      const ed = parseDMY(edStr);

      if (!sdStr) { setError(startEl, errStart, 'Start Date is required'); ok = false; }
      else if (!sd) { setError(startEl, errStart, 'Use dd/mm/yyyy'); ok = false; }
      else setError(startEl, errStart, '');

      if (!edStr) { setError(endEl, errEnd, 'End Date is required'); ok = false; }
      else if (!ed) { setError(endEl, errEnd, 'Use dd/mm/yyyy'); ok = false; }
      else setError(endEl, errEnd, '');

      // Compare if both valid
      if (sd && ed && ed < sd){
        setError(endEl, errEnd, 'End Date must be same or after Start Date');
        ok = false;
      }

      return { ok, mobile, sdStr, edStr };
    }

    // Clear errors on typing
    [mobileEl, startEl, endEl].forEach(el => {
      el.addEventListener('input', () => {
        if (el === mobileEl) setError(mobileEl, errMobile, '');
        if (el === startEl) setError(startEl, errStart, '');
        if (el === endEl) setError(endEl, errEnd, '');
      });
    });

    // ADD ROW (WORKING)
    document.getElementById('addRow').addEventListener('click', () => {
      const v = validateRow();
      if (!v.ok) return;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(v.mobile)}</td>
        <td>${escapeHtml(v.sdStr)}</td>
        <td>${escapeHtml(v.edStr)}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="mini-btn" data-act="edit">Edit</button>
          <button type="button" class="mini-btn" data-act="del">Delete</button>
        </td>
      `;
      tableBody.appendChild(tr);

      // clear inputs
      mobileEl.value = '';
      startEl.value = '';
      endEl.value = '';
      setError(mobileEl, errMobile, '');
      setError(startEl, errStart, '');
      setError(endEl, errEnd, '');
    });

    // Edit / Delete
    tableBody.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const tr = btn.closest('tr');
      const act = btn.getAttribute('data-act');

      if (act === 'del') tr.remove();

      if (act === 'edit') {
        const tds = tr.querySelectorAll('td');
        mobileEl.value = tds[0].textContent.trim();
        startEl.value  = tds[1].textContent.trim();
        endEl.value    = tds[2].textContent.trim();
        tr.remove();
        mobileEl.focus();
      }
    });

    // Submit validation: require at least 1 detail row
    document.getElementById('cdrForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const hasRows = tableBody.querySelectorAll('tr').length > 0;
      if (!hasRows){
        alert('Please add at least one Details row using ADD ROW before submitting.');
        return;
      }
      alert('Submitted (demo). Connect this to backend/API.');
    });

    // Reset: clear errors + table
    document.getElementById('cdrForm').addEventListener('reset', () => {
      setTimeout(() => {
        tableBody.innerHTML = '';
        setError(mobileEl, errMobile, '');
        setError(startEl, errStart, '');
        setError(endEl, errEnd, '');
      }, 0);
    });
  </script>
</body>
</html>
