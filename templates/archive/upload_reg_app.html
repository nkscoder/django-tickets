{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
  .imp-wrap{
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 12px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    color: #111827;
  }
  .imp-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:14px;
  }
  .imp-title{
    margin:0;
    font-size:24px;
    font-weight:800;
    letter-spacing:.2px;
  }
  .imp-sub{
    margin:6px 0 0;
    color:#6b7280;
    font-size:13px;
  }
  .imp-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .imp-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:16px;
    box-shadow:0 14px 34px rgba(17,24,39,.08);
  }
  .imp-card-top{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
  }
  .imp-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg, rgba(37,99,235,.12), rgba(20,184,166,.10));
    border:1px solid rgba(37,99,235,.20);
    font-size:18px;
  }
  .imp-drop{
    display:block;
    border:2px dashed #d1d5db;
    background:#f9fafb;
    border-radius:16px;
    padding:14px;
    cursor:pointer;
    transition:.15s ease;
  }
  .imp-drop:hover{
    border-color:#2563eb;
    background:#f3f7ff;
  }
  .imp-drop.green{
    border-color:#22c55e;
    background:#f0fdf4;
  }
  .imp-drop-inner{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .imp-file-ic{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#fff;
    border:1px solid #e5e7eb;
    display:grid;
    place-items:center;
    font-size:20px;
    flex:0 0 auto;
  }
  .imp-filename{
    margin-top:10px;
    font-size:12px;
    color:#111827;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:8px 10px;
  }
  .tick{
    margin-left:auto;
    width:28px;
    height:28px;
    border-radius:10px;
    display:none;
    place-items:center;
    font-weight:900;
    color:#16a34a;
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.25);
    flex:0 0 auto;
  }
  .tick.show{ display:grid; }
  .imp-logline{
    margin-top:8px;
    font-size:12px;
    color:#374151;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .imp-log-pill{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:999px;
    padding:4px 10px;
    font-size:12px;
    line-height:1.2;
  }
  .imp-log-pill b{
    font-weight:900;
    color:#111827;
  }
  .imp-upload-row{
    margin-top:10px;
    display:flex;
    justify-content:flex-end;
  }
  .imp-btn{
    border:0;
    padding:10px 14px;
    border-radius:14px;
    font-weight:800;
    background:linear-gradient(135deg, #2563eb, #14b8a6);
    color:#fff;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(37,99,235,.18);
    transition:transform .12s ease, opacity .12s ease;
  }
  .imp-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    box-shadow:none;
  }
</style>

<div class="imp-wrap">
  <div class="imp-head">
    <div>
      <h2 class="imp-title">Import Data</h2>
      <p class="imp-sub">Upload one file at a time. This page is optimized for large CSV/XLSX imports.</p>
    </div>
  </div>

  <div class="imp-grid">
    <div class="imp-card">
      <div class="imp-card-top">
        <div class="imp-icon">⬆️</div>
        <div>
          <div style="font-weight:800">Upload Files</div>
          <div style="font-size:12px;color:#6b7280">Choose import type and upload each file separately</div>
        </div>
      </div>

      <div style="display:flex;gap:24px;margin-bottom:16px;font-weight:700">
        <label><input type="radio" name="importType" value="app" checked> New Application</label>
        <label><input type="radio" name="importType" value="renewal"> Application Renewal</label>
      </div>

      <div id="group-app">
        <label class="imp-drop" id="dz-reg">
          <input type="file" id="f-reg" accept=".xlsx,.csv" hidden>
          <div class="imp-drop-inner">
            <div class="imp-file-ic">📄</div>
            <div style="width:100%">
              <div style="font-weight:800">application_details</div>
              <div class="imp-filename" id="name-reg">No file selected</div>

              {% with row=logs_by_table.application_details %}
              <div class="imp-logline">
                <span class="imp-log-pill">Type: <b>{% if row %}{{ row.type }}{% else %}-{% endif %}</b></span>
                <span class="imp-log-pill">Last Sync:
                  <b>{% if row and row.last_sync_at %}{{ row.last_sync_at|date:"d-m-Y H:i" }}{% else %}Never{% endif %}</b>
                </span>
                <span class="imp-log-pill">Ins: <b>{% if row %}{{ row.inserted }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Upd: <b>{% if row %}{{ row.updated }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Skp: <b>{% if row %}{{ row.skipped }}{% else %}0{% endif %}</b></span>
              </div>
              {% endwith %}

              <div class="imp-upload-row">
                <button type="button" class="imp-btn" onclick="event.preventDefault(); uploadSingle('reg')">
                  Upload application_details
                </button>
              </div>
            </div>
            <div class="tick" id="tick-reg">✓</div>
          </div>
        </label>

        <div style="height:10px"></div>

        <label class="imp-drop" id="dz-com">
          <input type="file" id="f-com" accept=".xlsx,.csv" hidden>
          <div class="imp-drop-inner">
            <div class="imp-file-ic">👥</div>
            <div style="width:100%">
              <div style="font-weight:800">committee_details</div>
              <div class="imp-filename" id="name-com">No file selected</div>

              {% with row=logs_by_table.committee_details %}
              <div class="imp-logline">
                <span class="imp-log-pill">Type: <b>{% if row %}{{ row.type }}{% else %}-{% endif %}</b></span>
                <span class="imp-log-pill">Last Sync:
                  <b>{% if row and row.last_sync_at %}{{ row.last_sync_at|date:"d-m-Y H:i" }}{% else %}Never{% endif %}</b>
                </span>
                <span class="imp-log-pill">Ins: <b>{% if row %}{{ row.inserted }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Upd: <b>{% if row %}{{ row.updated }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Skp: <b>{% if row %}{{ row.skipped }}{% else %}0{% endif %}</b></span>
              </div>
              {% endwith %}

              <div class="imp-upload-row">
                <button type="button" class="imp-btn" onclick="event.preventDefault(); uploadSingle('com')">
                  Upload committee_details
                </button>
              </div>
            </div>
            <div class="tick" id="tick-com">✓</div>
          </div>
        </label>
      </div>

      <div id="group-renewal" style="display:none">
        <label class="imp-drop" id="dz-logs">
          <input type="file" id="f-logs" accept=".xlsx,.csv" hidden>
          <div class="imp-drop-inner">
            <div class="imp-file-ic">🗂️</div>
            <div style="width:100%">
              <div style="font-weight:800">other_services_documents_link_logs</div>
              <div class="imp-filename" id="name-logs">No file selected</div>

              {% with row=logs_by_table.other_services_documents_link_logs %}
              <div class="imp-logline">
                <span class="imp-log-pill">Type: <b>{% if row %}{{ row.type }}{% else %}-{% endif %}</b></span>
                <span class="imp-log-pill">Last Sync:
                  <b>{% if row and row.last_sync_at %}{{ row.last_sync_at|date:"d-m-Y H:i" }}{% else %}Never{% endif %}</b>
                </span>
                <span class="imp-log-pill">Ins: <b>{% if row %}{{ row.inserted }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Upd: <b>{% if row %}{{ row.updated }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Skp: <b>{% if row %}{{ row.skipped }}{% else %}0{% endif %}</b></span>
              </div>
              {% endwith %}

              <div class="imp-upload-row">
                <button type="button" class="imp-btn" onclick="event.preventDefault(); uploadSingle('logs')">
                  Upload other_services_documents_link_logs
                </button>
              </div>
            </div>
            <div class="tick" id="tick-logs">✓</div>
          </div>
        </label>

        <div style="height:10px"></div>

        <label class="imp-drop" id="dz-mem">
          <input type="file" id="f-mem" accept=".xlsx,.csv" hidden>
          <div class="imp-drop-inner">
            <div class="imp-file-ic">🧾</div>
            <div style="width:100%">
              <div style="font-weight:800">committee_members_data</div>
              <div class="imp-filename" id="name-mem">No file selected</div>

              {% with row=logs_by_table.committee_members_data %}
              <div class="imp-logline">
                <span class="imp-log-pill">Type: <b>{% if row %}{{ row.type }}{% else %}-{% endif %}</b></span>
                <span class="imp-log-pill">Last Sync:
                  <b>{% if row and row.last_sync_at %}{{ row.last_sync_at|date:"d-m-Y H:i" }}{% else %}Never{% endif %}</b>
                </span>
                <span class="imp-log-pill">Ins: <b>{% if row %}{{ row.inserted }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Upd: <b>{% if row %}{{ row.updated }}{% else %}0{% endif %}</b></span>
                <span class="imp-log-pill">Skp: <b>{% if row %}{{ row.skipped }}{% else %}0{% endif %}</b></span>
              </div>
              {% endwith %}

              <div class="imp-upload-row">
                <button type="button" class="imp-btn" onclick="event.preventDefault(); uploadSingle('mem')">
                  Upload committee_members_data
                </button>
              </div>
            </div>
            <div class="tick" id="tick-mem">✓</div>
          </div>
        </label>
      </div>
    </div>
  </div>
</div>

{% endblock %}

<script src="{% static 'js/SweetAlert2.js' %}"></script>
<script>
function getCookie(name){
  const v = document.cookie.split("; ").find(r => r.startsWith(name + "="));
  return v ? decodeURIComponent(v.split("=")[1]) : null;
}

function setSelected(kind, file){
  const dz   = document.getElementById("dz-" + kind);
  const tick = document.getElementById("tick-" + kind);
  const name = document.getElementById("name-" + kind);

  if(!dz || !tick || !name) return;

  if(file){
    dz.classList.add("green");
    tick.classList.add("show");
    name.textContent = file.name;
  }else{
    dz.classList.remove("green");
    tick.classList.remove("show");
    name.textContent = "No file selected";
  }
}

function clearInput(kind){
  const input = document.getElementById("f-" + kind);
  if(input){
    input.value = "";
  }
  setSelected(kind, null);
}

function switchMode(mode){
  const groupApp = document.getElementById("group-app");
  const groupRenewal = document.getElementById("group-renewal");

  if(groupApp) groupApp.style.display = mode === "app" ? "block" : "none";
  if(groupRenewal) groupRenewal.style.display = mode === "renewal" ? "block" : "none";

  if(mode === "app"){
    clearInput("mem");
    clearInput("logs");
  }else{
    clearInput("reg");
    clearInput("com");
  }
}

function updateLogUI(kind, out){
  const dz = document.getElementById("dz-" + kind);
  if(!dz) return;

  const logline = dz.querySelector(".imp-logline");
  if(!logline) return;

  let typeText = out.type || "-";
  let lastSyncText = out.last_sync_at || "Just now";
  let insertedText = out.inserted ?? 0;
  let updatedText = out.updated ?? 0;
  let skippedText = out.skipped ?? 0;

  logline.innerHTML = `
    <span class="imp-log-pill">Type: <b>${typeText}</b></span>
    <span class="imp-log-pill">Last Sync: <b>${lastSyncText}</b></span>
    <span class="imp-log-pill">Ins: <b>${insertedText}</b></span>
    <span class="imp-log-pill">Upd: <b>${updatedText}</b></span>
    <span class="imp-log-pill">Skp: <b>${skippedText}</b></span>
  `;
}

document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll("input[name='importType']").forEach(radio => {
    radio.addEventListener("change", function(e){
      switchMode(e.target.value);
    });
  });

  switchMode("app");

  ["reg","com","mem","logs"].forEach(kind => {
    const input = document.getElementById("f-" + kind);
    if(input){
      input.addEventListener("change", function(){
        const file = input.files[0] || null;
        setSelected(kind, file);
      });
    }
  });
});

async function uploadSingle(kind){
  const input = document.getElementById("f-" + kind);
  const file = input ? input.files[0] : null;

  if(!file){
    Swal.fire("Required", "Please choose a file first", "error");
    return;
  }

  const fd = new FormData();
  fd.append("kind", kind);
  fd.append("excel", file);

  Swal.fire({
    title: "Uploading...",
    text: "Large file import is running. Please wait.",
    allowOutsideClick: false,
    allowEscapeKey: false,
    didOpen: () => Swal.showLoading()
  });

  try{
    const res = await fetch("{% url 'tickets:import_single_file' %}", {
      method: "POST",
      body: fd,
      headers: {
        "X-CSRFToken": getCookie("csrftoken")
      },
      credentials: "same-origin"
    });

    const out = await res.json();

    Swal.close();

    if(out.responseCode === 200){
      updateLogUI(kind, out);

      Swal.fire({
        title: "Success",
        html: `
          ${kind} imported successfully.<br>
          Inserted: ${out.inserted ?? 0}<br>
          Updated: ${out.updated ?? 0}<br>
          Skipped: ${out.skipped ?? 0}
        `,
        icon: "success"
      }).then(() => {
        clearInput(kind);
      });
    }else{
      Swal.fire("Failed", out.responseMessage || "Error", "error");
    }
  }catch(e){
    Swal.close();
    Swal.fire("Error", "Network error or timeout", "error");
  }
}
</script>
{% endblock %}
