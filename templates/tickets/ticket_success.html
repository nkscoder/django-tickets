<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Completed!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            background: #fff;
            border-radius: 20px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: perspective(1000px) rotateY(10deg);
            transition: transform 0.5s ease;
        }

        .success-card:hover {
            transform: perspective(1000px) rotateY(0deg);
        }

        .success-card h1 {
            font-size: 3rem;
            color: #4caf50;
            margin-bottom: 20px;
        }

        .success-card p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-home {
            background: #4caf50;
            color: #fff;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="success-card">
    <h1>🎉 Success!</h1>
    <p>You have successfully submitted all answers for the ticket:</p>
    <h3>{{ ticket.title }}</h3>
    <a href="{% url 'tickets:ticket_list' %}" class="btn-home">Go to My Tickets</a>
</div>

</body>
</html>
