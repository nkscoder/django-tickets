[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nkscoder-django-tickets"
version = "1.0.3"
description = "Open-source Django ticket system by Nitesh Kumar Singh (nkscoder): assignments, Q&A, notifications & REST API. Generic plugin for any Django project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nitesh Kumar Singh (nkscoder)", email = "contact@nkscoder.in" },
]
maintainers = [
    { name = "Nitesh Kumar Singh (nkscoder)", email = "contact@nkscoder.in" },
]
keywords = [
    "django",
    "tickets",
    "workflow",
    "helpdesk",
    "django-tickets",
    "nitesh kumar singh",
    "nitesh kumar singh nkscoder",
    "nkscoder",
    "nkscoder django",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/nkscoder/django-tickets"
Documentation = "https://github.com/nkscoder/django-tickets#readme"
Repository = "https://github.com/nkscoder/django-tickets"
"Bug Tracker" = "https://github.com/nkscoder/django-tickets/issues"
"PyPI Profile" = "https://pypi.org/user/nkscoder/"
"Author Website" = "https://nkscoder.in"
"Author GitHub" = "https://github.com/nkscoder"
"LinkedIn" = "https://www.linkedin.com/in/nitesh-kumar-singh-897437a2/"

[project.optional-dependencies]
dev = ["pytest-django", "build", "twine"]

[tool.setuptools]
package-dir = { "tickets" = "." }
packages = [
    "tickets",
    "tickets.views",
    "tickets.templatetags",
    "tickets.migrations",
    "tickets.tests",
]

[tool.setuptools.package-data]
tickets = [
    "templates/tickets/**/*",
    "templatetags/*.py",
    "migrations/*",
]

[tool.setuptools.exclude-package-data]
tickets = [
    "legacy_archive/**/*",
    "migrations_legacy/**/*",
    "templates/archive/**/*",
]
