# Publish django-tickets to PyPI when you create a GitHub Release.
# Setup: GitHub repo → Settings → Secrets → Actions → New secret
#   Name:  PYPI_API_TOKEN
#   Value: pypi-... (from https://pypi.org/manage/account/token/)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # manual run from Actions tab

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
